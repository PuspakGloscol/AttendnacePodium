<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L3 Admin</title><link rel="stylesheet" href="../admin.css"></head><body><main class="admin-wrap"><header class="admin-head"><div><h1>L3 Admin</h1><p>Manage the live attendance and punctuality leaderboard.</p></div><img class="logo" src="../gc-logo.jpg" alt="Gloucestershire College"></header><section id="loginView" class="panel login"><h2>Admin Login</h2><p>Use the administrator account for this department.</p><form id="loginForm"><label>Email</label><input id="email" type="email" autocomplete="username" required><br><br><label>Password</label><input id="password" type="password" autocomplete="current-password" required><br><br><button class="btn" type="submit">Sign in</button><div id="loginError" class="error"></div></form></section><section id="appView" class="hidden"><div class="panel"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><strong>Signed in as <span id="adminEmail"></span></strong><div id="adminStatus" class="message"></div></div><button id="logout" class="btn secondary">Sign out</button></div></div><div class="panel"><h2>Add / Edit Group</h2><form id="groupForm"><div class="form-grid"><div><label>Group name</label><input id="groupName" required placeholder="e.g. L3 Computing A"></div><div><label>Attendance %</label><input id="attendance" type="number" min="0" max="100" step="0.1" required></div><div><label>Punctuality %</label><input id="punctuality" type="number" min="0" max="100" step="0.1" required></div><button id="saveBtn" class="btn">Add group</button></div></form></div><div class="panel"><h2>Current groups</h2><div class="table-wrap"><table><thead><tr><th>GROUP</th><th>ATTENDANCE</th><th>PUNCTUALITY</th><th>ACTIONS</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="../common-admin.js"></script></body></html>
